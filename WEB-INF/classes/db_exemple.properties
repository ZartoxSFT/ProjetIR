# EXEMPLE DE CONFIGURATION BASE DE DONNEES
# Copier ce fichier vers db.properties puis remplacer les valeurs par celles de l'environnement local.

# URL JDBC de la base PostgreSQL
db.url="lien de connexion a la base de donnees"

# Identifiant utilise par l'application pour ouvrir une connexion
db.user="nom d'utilisateur de la base de donnees"

# Mot de passe associe a l'utilisateur de base de donnees
db.password="mot de passe de la base de donnees"
