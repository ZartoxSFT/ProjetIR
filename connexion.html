<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanfareHub - Connexion</title>
    <style>
        :root {
            --bg-1: #f7f4ee;
            --bg-2: #ece4d8;
            --card: #fffdfa;
            --text: #1f1b16;
            --muted: #706257;
            --accent: #b1442f;
            --accent-strong: #8f3423;
            --border: #d8c8b6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 10%, rgba(177, 68, 47, 0.12), transparent 35%),
                radial-gradient(circle at 85% 0%, rgba(31, 27, 22, 0.08), transparent 30%),
                linear-gradient(165deg, var(--bg-1), var(--bg-2));
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(520px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(31, 27, 22, 0.15);
            overflow: hidden;
        }

        .header {
            padding: 22px 24px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(120deg, #f6ecde, #fdfaf4);
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .header p {
            margin: 8px 0 0;
            color: var(--muted);
        }

        form {
            padding: 24px;
            display: grid;
            gap: 14px;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.98rem;
            background: #fff;
        }

        input:focus {
            outline: 2px solid rgba(177, 68, 47, 0.22);
            border-color: var(--accent);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }

        .actions a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .actions a:hover {
            color: var(--accent-strong);
            text-decoration: underline;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 12px 20px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-strong);
        }

        @media (max-width: 580px) {
            .actions {
                flex-direction: column;
                align-items: stretch;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h1>Connexion FanfareHub</h1>
            <p>Connectez-vous avec votre nom de fanfaron et votre mot de passe.</p>
        </div>

        <form action="connexion" method="post">
            <div class="field">
                <label for="username">Nom de fanfaron</label>
                <input type="text" id="username" name="username" maxlength="40" required>
            </div>

            <div class="field">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="actions">
                <a href="inscription.html">Creer un compte</a>
                <button type="submit">Se connecter</button>
            </div>
        </form>
    </div>
</body>

</html>
