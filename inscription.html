<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanfareHub - Inscription</title>
    <style>
        :root {
            --bg-1: #f7f4ee;
            --bg-2: #ece4d8;
            --card: #fffdfa;
            --text: #1f1b16;
            --muted: #706257;
            --accent: #b1442f;
            --accent-strong: #8f3423;
            --border: #d8c8b6;
            --error: #b00020;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 10%, rgba(177, 68, 47, 0.12), transparent 35%),
                radial-gradient(circle at 85% 0%, rgba(31, 27, 22, 0.08), transparent 30%),
                linear-gradient(165deg, var(--bg-1), var(--bg-2));
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(760px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(31, 27, 22, 0.15);
            overflow: hidden;
        }

        .header {
            padding: 22px 24px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(120deg, #f6ecde, #fdfaf4);
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .header p {
            margin: 8px 0 0;
            color: var(--muted);
        }

        form {
            padding: 24px;
            display: grid;
            gap: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        input,
        select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.98rem;
            background: #fff;
        }

        input:focus,
        select:focus {
            outline: 2px solid rgba(177, 68, 47, 0.22);
            border-color: var(--accent);
        }

        .error {
            color: var(--error);
            font-size: 0.9rem;
            margin: 0;
            min-height: 1.2em;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }

        .actions a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .actions a:hover {
            color: var(--accent-strong);
            text-decoration: underline;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 12px 20px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-strong);
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
                align-items: stretch;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h1>Inscription FanfareHub</h1>
            <p>Remplissez le formulaire pour creer votre compte fanfaron.</p>
        </div>

        <form id="inscriptionForm" action="inscription" method="post" novalidate>
            <div class="grid">
                <div class="field full">
                    <label for="username">Nom de fanfaron (identifiant unique)</label>
                    <input type="text" id="username" name="nom_fanfaron" maxlength="40" required>
                </div>

                <div class="field">
                    <label for="firstName">Prenom</label>
                    <input type="text" id="firstName" name="prenom" maxlength="60" required>
                </div>

                <div class="field">
                    <label for="lastName">Nom</label>
                    <input type="text" id="lastName" name="nom" maxlength="60" required>
                </div>

                <div class="field">
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="field">
                    <label for="emailConfirm">Confirmation email</label>
                    <input type="email" id="emailConfirm" name="emailConfirm" required>
                </div>

                <div class="field">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" minlength="8" required>
                </div>

                <div class="field">
                    <label for="passwordConfirm">Confirmation mot de passe</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" minlength="8" required>
                </div>

                <div class="field">
                    <label for="genre">Genre</label>
                    <select id="genre" name="genre" required>
                        <option value="">Selectionner...</option>
                        <option value="homme">Homme</option>
                        <option value="femme">Femme</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>

                <div class="field">
                    <label for="dietary">Contraintes alimentaires</label>
                    <select id="dietary" name="contraintes_alimentaires" required>
                        <option value="aucune">Aucune</option>
                        <option value="vegetarien">Vegetarien</option>
                        <option value="vegan">Vegan</option>
                        <option value="sans porc">Sans porc</option>
                    </select>
                </div>
            </div>

            <p class="error" id="formError" aria-live="polite"></p>

            <div class="actions">
                <a href="connexion.html">J'ai deja un compte</a>
                <button type="submit">S'inscrire</button>
            </div>
        </form>
    </div>

    <script>
        (function () {
            const form = document.getElementById("inscriptionForm");
            const email = document.getElementById("email");
            const emailConfirm = document.getElementById("emailConfirm");
            const password = document.getElementById("password");
            const passwordConfirm = document.getElementById("passwordConfirm");
            const error = document.getElementById("formError");

            form.addEventListener("submit", function (event) {
                error.textContent = "";

                if (email.value.trim().toLowerCase() !== emailConfirm.value.trim().toLowerCase()) {
                    event.preventDefault();
                    error.textContent = "Les adresses email ne correspondent pas.";
                    emailConfirm.focus();
                    return;
                }

                if (password.value !== passwordConfirm.value) {
                    event.preventDefault();
                    error.textContent = "Les mots de passe ne correspondent pas.";
                    passwordConfirm.focus();
                }
            });
        })();
    </script>
</body>

</html>
